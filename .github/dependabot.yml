# Weekly dependency checks. Minor and patch updates are grouped into one pull
# request per ecosystem so they do not pile up; every PR still has to pass the
# normal CI. See docs/REPOSITORY.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directories: ["/", "/app"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message:
      prefix: "build"
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # AGP, Kotlin and Gradle majors move together with the pinned NDK/SDK and are upgraded by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
