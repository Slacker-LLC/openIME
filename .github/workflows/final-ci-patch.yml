name: Apply final CI fixes

on:
  push:
    branches:
      - fix/final-ci-20260913

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-ci-20260913
          fetch-depth: 0
      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Segmented pinyin is intentionally accepted by the production mapper.
          path = Path('app/src/test/java/llc/slacker/openime/CandidatePipelineTest.kt')
          text = path.read_text()
          old = '''        assertNull(CandidatePipeline.nineKeyDigitsFor("ni hao"))
          assertNull(CandidatePipeline.nineKeyDigitsFor("ni2hao"))'''
          new = '''        assertEquals("64426", CandidatePipeline.nineKeyDigitsFor("ni hao"))
          assertEquals("64426", CandidatePipeline.nineKeyDigitsFor("ni'hao"))
          assertEquals("64426", CandidatePipeline.nineKeyDigitsFor("ni|hao"))
          assertNull(CandidatePipeline.nineKeyDigitsFor("ni2hao"))'''
          if old not in text:
              raise RuntimeError('CandidatePipelineTest mapping assertion block not found')
          path.write_text(text.replace(old, new, 1))

          # 2) Preserve a manually-selected 9-key path while the next syllable is incomplete.
          path = Path('app/src/main/java/llc/slacker/openime/NineKeyLocalDecoder.kt')
          text = path.read_text()
          old = '''        val prefixPreview = (preferredDescendant ?: node?.bestDescendant)
              ?.pinyin
              ?.take(bounded.length)
              ?.takeIf { digitsForPinyin(it) == bounded }
          val preview = when {
              stable != null -> stable
              continuous != null -> continuous
              continuationBase != null && prefixPreview != null -> prefixPreview
              paths.isNotEmpty() -> paths.first()
              prefixPreview != null -> prefixPreview
              else -> fallbackLetters(bounded)
          }'''
          new = '''        val prefixPreview = (preferredDescendant ?: node?.bestDescendant)
              ?.pinyin
              ?.take(bounded.length)
              ?.takeIf { digitsForPinyin(it) == bounded }
          val continuationPrefix = continuationBase?.let { base ->
              val baseDigits = digitsForPinyin(base) ?: return@let null
              if (!bounded.startsWith(baseDigits) || bounded.length <= baseDigits.length) return@let null
              (base + fallbackLetters(bounded.drop(baseDigits.length)))
                  .takeIf { digitsForPinyin(it) == bounded }
          }
          val preview = when {
              stable != null -> stable
              continuous != null -> continuous
              continuationBase != null && preferredDescendant != null && prefixPreview != null -> prefixPreview
              continuationPrefix != null -> continuationPrefix
              paths.isNotEmpty() -> paths.first()
              prefixPreview != null -> prefixPreview
              else -> fallbackLetters(bounded)
          }'''
          if old not in text:
              raise RuntimeError('NineKeyLocalDecoder preview block not found')
          path.write_text(text.replace(old, new, 1))

          # 3) The ownership instrumentation creates the service directly; attach a real test context.
          path = Path('app/src/androidTest/java/llc/slacker/openime/ManualVoiceOwnershipInstrumentedTest.kt')
          text = path.read_text()
          old_import = 'import android.view.inputmethod.InputConnection\n'
          new_import = 'import android.content.Context\nimport android.content.ContextWrapper\nimport android.view.inputmethod.InputConnection\n'
          if old_import not in text:
              raise RuntimeError('ManualVoiceOwnership import anchor not found')
          text = text.replace(old_import, new_import, 1)
          old_service = '''                val service = LocalVoiceImeService()
                  fun setField(name: String, value: Any) {'''
          new_service = '''                val service = LocalVoiceImeService()
                  ContextWrapper::class.java.getDeclaredMethod("attachBaseContext", Context::class.java).apply {
                      isAccessible = true
                      invoke(service, InstrumentationRegistry.getInstrumentation().targetContext)
                  }
                  fun setField(name: String, value: Any) {'''
          if old_service not in text:
              raise RuntimeError('ManualVoiceOwnership service fixture anchor not found')
          path.write_text(text.replace(old_service, new_service, 1))

          # 4) Android 10 allows clipboard reads to the foreground app; wait until the test Activity owns focus.
          path = Path('app/src/androidTest/java/llc/slacker/openime/ClipboardRetentionInstrumentedTest.kt')
          text = path.read_text()
          old_import = 'import android.os.PersistableBundle\n'
          new_import = 'import android.os.PersistableBundle\nimport android.os.SystemClock\n'
          if old_import not in text:
              raise RuntimeError('Clipboard SystemClock import anchor not found')
          text = text.replace(old_import, new_import, 1)
          old_import2 = 'import org.junit.Assert.assertFalse\n'
          new_import2 = 'import org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport java.util.concurrent.atomic.AtomicBoolean\n'
          if old_import2 not in text:
              raise RuntimeError('Clipboard assertion import anchor not found')
          text = text.replace(old_import2, new_import2, 1)
          old_test = '''    fun sensitiveSystemClipIsNeverCapturedIntoHistory() {
          rule.scenario.onActivity { activity ->'''
          new_test = '''    fun sensitiveSystemClipIsNeverCapturedIntoHistory() {
          awaitWindowFocus()
          rule.scenario.onActivity { activity ->'''
          if old_test not in text:
              raise RuntimeError('Clipboard test anchor not found')
          text = text.replace(old_test, new_test, 1)
          helper_anchor = '''    private fun findTextView(root: View, label: String): TextView? {'''
          helper = '''    private fun awaitWindowFocus(timeoutMs: Long = 5_000L) {
          val deadline = SystemClock.uptimeMillis() + timeoutMs
          val focused = AtomicBoolean(false)
          while (SystemClock.uptimeMillis() < deadline) {
              rule.scenario.onActivity { activity -> focused.set(activity.hasWindowFocus()) }
              if (focused.get()) return
              SystemClock.sleep(25L)
          }
          assertTrue("DebugKeyboardActivity never gained window focus", focused.get())
      }

      private fun findTextView(root: View, label: String): TextView? {'''
          if helper_anchor not in text:
              raise RuntimeError('Clipboard helper anchor not found')
          path.write_text(text.replace(helper_anchor, helper, 1))
          PY

          git diff --check
          git rm .github/workflows/final-ci-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/llc/slacker/openime/NineKeyLocalDecoder.kt \
                  app/src/test/java/llc/slacker/openime/CandidatePipelineTest.kt \
                  app/src/androidTest/java/llc/slacker/openime/ManualVoiceOwnershipInstrumentedTest.kt \
                  app/src/androidTest/java/llc/slacker/openime/ClipboardRetentionInstrumentedTest.kt
          git commit -m "Fix nine-key continuity and compatibility fixtures"
          git push origin HEAD:fix/final-ci-20260913
