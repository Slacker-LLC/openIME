name: Localize keyboard panels

on:
  push:
    branches:
      - fix/ux-followups
    paths:
      - .github/workflows/localize-keyboard-panels.yml
      - .github/scripts/localize_keyboard_panels.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-followups
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply localization patch
        run: python3 .github/scripts/localize_keyboard_panels.py

      - name: Structural checks
        shell: bash
        run: |
          grep -n 'R.string.tool_emoji' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'R.string.handwriting_unconfigured_label' app/src/main/java/llc/slacker/openime/ImeKeyboardViewV2.kt
          grep -n 'R.string.clipboard_clear_unpinned' app/src/main/java/llc/slacker/openime/ImeKeyboardViewV2.kt
          grep -n 'R.string.voice_service_not_initialized' app/src/main/java/llc/slacker/openime/LocalVoiceImeService.kt
          grep -n 'R.string.clear_all_failed' app/src/main/java/llc/slacker/openime/LocalVoiceImeService.kt
          git diff --check

      - name: Compile Kotlin
        id: compile
        continue-on-error: true
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Record validation status
        shell: bash
        run: |
          echo "compile=${{ steps.compile.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          if [ "${{ steps.compile.outcome }}" != "success" ]; then
            echo "Compile validation may be blocked by the intermittent sherpa-onnx AAR resource transform failure; structural checks remain mandatory."
          fi

      - name: Commit localization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt \
                  app/src/main/java/llc/slacker/openime/ImeKeyboardViewV2.kt \
                  app/src/main/java/llc/slacker/openime/LocalVoiceImeService.kt
          git commit -m 'feat(i18n): finish keyboard surface localization'
          git fetch origin fix/ux-followups
          git rebase origin/fix/ux-followups
          git push origin HEAD:fix/ux-followups
