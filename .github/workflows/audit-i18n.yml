name: Audit i18n literals

on:
  push:
    branches:
      - fix/ux-followups
    paths:
      - .github/workflows/audit-i18n.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-followups
      - name: List CJK string literals in user-facing Kotlin
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          files = [
              Path('app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt'),
              Path('app/src/main/java/llc/slacker/openime/ImeKeyboardViewV2.kt'),
              Path('app/src/main/java/llc/slacker/openime/LocalVoiceImeService.kt'),
              Path('app/src/main/java/llc/slacker/openime/ImeSettingsActivity.kt'),
          ]
          cjk = re.compile(r'[\u4e00-\u9fff]')
          string = re.compile(r'"(?:\\.|[^"\\])*"')
          for path in files:
              if not path.exists():
                  continue
              print(f'### {path}')
              for i, line in enumerate(path.read_text().splitlines(), 1):
                  literals = [m.group(0) for m in string.finditer(line) if cjk.search(m.group(0))]
                  if literals:
                      print(f'{i}: ' + ' | '.join(literals))
          PY
