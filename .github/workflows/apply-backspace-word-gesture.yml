name: Apply backspace word gesture

on:
  push:
    branches:
      - fix/ux-followups
    paths:
      - .github/workflows/apply-backspace-word-gesture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-followups
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply gesture patch
        run: python3 .github/scripts/apply_backspace_word_gesture.py

      - name: Structural checks
        shell: bash
        run: |
          grep -n 'delete-word' app/src/main/java/llc/slacker/openime/LocalVoiceImeService.kt
          grep -n 'installBackspaceGestures' app/src/main/java/llc/slacker/openime/NineKeySymbolRailDecorator.kt
          git diff --check

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Run focused unit test
        run: ./gradlew :app:testDebugUnitTest --tests 'llc.slacker.openime.DeleteWordPolicyTest' --no-daemon

      - name: Commit gesture patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/llc/slacker/openime/LocalVoiceImeService.kt \
                  app/src/main/java/llc/slacker/openime/NineKeySymbolRailDecorator.kt
          git commit -m 'feat(ime): add backspace swipe-left delete word'
          git push origin HEAD:fix/ux-followups
