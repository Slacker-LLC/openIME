name: Apply UX follow-up cleanup

on:
  push:
    branches:
      - fix/ux-followups
    paths:
      - .github/workflows/apply-ux-followups.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-followups
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove English T9 dead code
        run: python3 .github/scripts/remove_english_t9.py

      - name: Verify English T9 is gone
        shell: bash
        run: |
          if grep -R -n -E 'ENGLISH_T9|lastT9Digits|t9Filter|renderEnglish9|t9-layout|t9-filter-container|t9-actions|getT9EnglishCandidates' app/src; then
            echo 'English T9 references remain after cleanup' >&2
            exit 1
          fi

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/llc/slacker/openime/ImeState.kt \
                  app/src/main/java/llc/slacker/openime/CandidatePipeline.kt \
                  app/src/main/java/llc/slacker/openime/CandidateEngine.kt \
                  app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          git commit -m 'refactor(ime): remove English T9 dead code'
          git push origin HEAD:fix/ux-followups
