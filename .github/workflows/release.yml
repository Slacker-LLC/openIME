name: Android Release

# A release is a signed arm64 APK built from a vX.Y.Z or vX.Y.Z-beta.N tag on main
# (a beta is published as a GitHub pre-release and never as "latest"). The same build
# and verification script (scripts/release_build.sh) is rehearsed with a throwaway
# key on manual runs and on pull requests that touch the release pipeline, so the
# first real release is not the first time it runs. See docs/RELEASE.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release_build.sh'
      - 'scripts/release_check.py'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'app/build.gradle.kts'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Holds the signing key but cannot write to the repository.
  build:
    name: ${{ github.ref_type == 'tag' && 'Build signed arm64 release' || 'Release rehearsal (throwaway key)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read

    steps:
      - name: Checkout source and LFS files
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - name: Release tag is on main and its CI passed
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME must point at a commit on main"
            exit 1
          fi

          required=("Build and verify" "Compatibility API 29" "Compatibility API 31")
          deadline=$((SECONDS + 2400))
          while true; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '.check_runs')"
            waiting=0
            for name in "${required[@]}"; do
              latest="$(jq -c --arg n "$name" '[.[] | select(.name == $n)] | sort_by(.started_at) | last // {}' <<<"$runs")"
              conclusion="$(jq -r '.conclusion // "pending"' <<<"$latest")"
              case "$conclusion" in
                success) ;;
                pending) waiting=1 ;;
                *)
                  echo "::error::CI check '$name' ended as '$conclusion' for $GITHUB_SHA"
                  exit 1
                  ;;
              esac
            done
            [[ "$waiting" -eq 0 ]] && break
            if (( SECONDS >= deadline )); then
              echo "::error::CI for $GITHUB_SHA did not finish within 40 minutes"
              exit 1
            fi
            echo "Waiting for CI on $GITHUB_SHA ..."
            sleep 30
          done
          echo "CI passed for $GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build components
        shell: bash
        run: |
          sdkmanager "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Verify LFS objects
        shell: bash
        run: |
          git lfs checkout
          if grep -RIl --exclude-dir=.git "version https://git-lfs.github.com/spec/v1" app/libs app/src/main/assets/models; then
            echo "A Git LFS pointer was left unresolved" >&2
            exit 1
          fi

      - name: Fetch pinned librime dependencies
        shell: bash
        run: bash scripts/fetch_rime_deps.sh

      - name: Ensure Gradle wrapper is executable
        shell: bash
        run: chmod +x gradlew

      # Only this step ever reads the signing secrets, and only for tags. Pull
      # requests and manual runs sign with a key that exists for this job alone.
      - name: Use the release signing key
        if: github.ref_type == 'tag'
        shell: bash
        env:
          OPENIME_KEYSTORE_B64: ${{ secrets.OPENIME_KEYSTORE_B64 }}
          OPENIME_KEYSTORE_PASSWORD: ${{ secrets.OPENIME_KEYSTORE_PASSWORD }}
          OPENIME_KEY_ALIAS: ${{ secrets.OPENIME_KEY_ALIAS }}
          OPENIME_KEY_PASSWORD: ${{ secrets.OPENIME_KEY_PASSWORD }}
        run: |
          for name in OPENIME_KEYSTORE_B64 OPENIME_KEYSTORE_PASSWORD OPENIME_KEY_ALIAS OPENIME_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing release signing secret ${name}. Run scripts/setup_release_signing.sh (docs/RELEASE.md)."
              exit 1
            fi
          done
          # These three go to GITHUB_ENV as NAME=value lines; a newline would inject more.
          for name in OPENIME_KEYSTORE_PASSWORD OPENIME_KEY_ALIAS OPENIME_KEY_PASSWORD; do
            if [[ "${!name}" == *$'\n'* ]]; then
              echo "::error::${name} must be a single line"
              exit 1
            fi
          done
          printf '%s' "$OPENIME_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/openime-release.jks"
          chmod 600 "$RUNNER_TEMP/openime-release.jks"
          {
            echo "OPENIME_KEYSTORE_PATH=$RUNNER_TEMP/openime-release.jks"
            echo "OPENIME_KEYSTORE_PASSWORD=$OPENIME_KEYSTORE_PASSWORD"
            echo "OPENIME_KEY_ALIAS=$OPENIME_KEY_ALIAS"
            echo "OPENIME_KEY_PASSWORD=$OPENIME_KEY_PASSWORD"
            echo "OPENIME_RELEASE_TAG=$GITHUB_REF_NAME"
          } >> "$GITHUB_ENV"

      - name: Use a throwaway rehearsal key
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore "$RUNNER_TEMP/rehearsal.jks" -storetype PKCS12 \
            -alias rehearsal -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$password" -keypass "$password" \
            -dname "CN=openIME Rehearsal, O=CI throwaway"
          {
            echo "OPENIME_KEYSTORE_PATH=$RUNNER_TEMP/rehearsal.jks"
            echo "OPENIME_KEYSTORE_PASSWORD=$password"
            echo "OPENIME_KEY_ALIAS=rehearsal"
            echo "OPENIME_KEY_PASSWORD=$password"
            echo "OPENIME_REHEARSAL=1"
          } >> "$GITHUB_ENV"

      - name: Test, lint, build and verify the release APK
        id: release
        shell: bash
        run: bash scripts/release_build.sh

      - name: Summary
        shell: bash
        run: |
          {
            echo "### openIME ${{ steps.release.outputs.version }}"
            echo
            echo "- APK: \`${{ steps.release.outputs.apk }}\`"
            echo "- Signing certificate SHA-256: \`${{ steps.release.outputs.cert_sha256 }}\`"
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              echo "- **Rehearsal only**: signed with a throwaway key, nothing is published."
            fi
            echo
            echo '```'
            cat "${{ steps.release.outputs.out_dir }}/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release files for publishing
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: ${{ steps.release.outputs.out_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Can write to the repository but never sees the signing key.
  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files

      - name: Verify checksums
        shell: bash
        run: |
          cd release-files
          sha256sum -c SHA256SUMS.txt

      # Created as a draft and only published once every asset is attached, so a
      # failed upload never leaves a public release without its APK.
      - name: Create draft, check assets, publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel_flags=()
          latest_flag=--latest
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            channel_flags=(--prerelease)
            latest_flag=--latest=false
          fi
          # The APK is the only asset; its SHA-256 and the signing certificate
          # are in the release notes, and the licenses ship inside the APK.
          gh release create "$GITHUB_REF_NAME" \
            release-files/openIME-*-arm64-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            "${channel_flags[@]}" \
            --title "openIME $GITHUB_REF_NAME" \
            --notes-file release-files/RELEASE_NOTES.md

          count="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [[ "$count" -ne 1 ]]; then
            echo "::error::Expected exactly the APK as release asset, found $count; the draft was left unpublished."
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "$latest_flag"
