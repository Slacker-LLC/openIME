name: Finish UX followups

on:
  push:
    branches:
      - fix/ux-followups
    paths:
      - .github/workflows/add-theme-selector.yml
      - .github/scripts/add_theme_selector.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-followups
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply final UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/add_theme_selector.py')
          s = p.read_text()
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected 1 match, got {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count == 0:\n        if new in text:\n            return text\n        raise SystemExit(f"{label}: expected target or already-patched replacement")\n    if label == "candidate expand description":\n        return text.replace(old, new)\n    if count != 1:\n        raise SystemExit(f"{label}: expected 1 match, got {count}")\n    return text.replace(old, new, 1)\n'''
          if old not in s:
              raise SystemExit('replace_once helper not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 .github/scripts/add_theme_selector.py
      - name: Structural checks
        shell: bash
        run: |
          grep -n 'spaceVoiceTriggerMs = 150L' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'settings_section_theme' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'ImeTheme.CYBERPUNK' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'localizedEnterKeyLabel' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'localizedEnterKeyLabel' app/src/main/java/llc/slacker/openime/ImeKeyboardViewV2.kt
          grep -n 'candidate_expand_more' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'theme selector' app/src/main/java/llc/slacker/openime/ImeDesignTokens.kt
          git diff --check
      - name: Compile Kotlin
        id: compile
        continue-on-error: true
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Record validation
        shell: bash
        run: |
          echo "compile=${{ steps.compile.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          if [ "${{ steps.compile.outcome }}" != "success" ]; then
            echo "Current hosted runner is intermittently failing sherpa-onnx AAR resource transformation before Kotlin compilation."
          fi
      - name: Commit final UX followups
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt \
            app/src/main/java/llc/slacker/openime/ImeKeyboardViewV2.kt \
            app/src/main/java/llc/slacker/openime/ImeDesignTokens.kt
          git commit -m 'fix(ux): finish theme voice and i18n followups'
          git fetch origin fix/ux-followups
          git rebase origin/fix/ux-followups
          git push origin HEAD:fix/ux-followups
