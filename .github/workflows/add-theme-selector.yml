name: Add theme selector

on:
  push:
    branches:
      - fix/ux-followups
    paths:
      - .github/workflows/add-theme-selector.yml
      - .github/scripts/add_theme_selector.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-followups
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply theme selector patch
        run: python3 .github/scripts/add_theme_selector.py
      - name: Structural checks
        shell: bash
        run: |
          grep -n 'settings_section_theme' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'ImeTheme.CYBERPUNK' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'theme selector' app/src/main/java/llc/slacker/openime/ImeDesignTokens.kt
          git diff --check
      - name: Compile Kotlin
        shell: bash
        run: |
          ./gradlew :app:compileDebugKotlin --no-daemon || {
            rm -rf ~/.gradle/caches/8.11.1/transforms
            ./gradlew :app:compileDebugKotlin --no-daemon
          }
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Commit theme selector
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt app/src/main/java/llc/slacker/openime/ImeDesignTokens.kt
          git commit -m 'feat(theme): expose bundled themes in settings'
          git fetch origin fix/ux-followups
          git rebase origin/fix/ux-followups
          git push origin HEAD:fix/ux-followups
