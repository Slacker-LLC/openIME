name: Finish UX followups

on:
  push:
    branches:
      - fix/ux-followups
    paths:
      - .github/workflows/add-theme-selector.yml
      - .github/scripts/add_theme_selector.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-followups
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply final UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/add_theme_selector.py')
          s = p.read_text()
          old_once = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected 1 match, got {count}")\n    return text.replace(old, new, 1)\n'''
          new_once = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count == 0:\n        if new in text or label in {"candidate row description", "localized enter labels"}:\n            return text\n        raise SystemExit(f"{label}: expected target or already-patched replacement")\n    if label == "candidate expand description":\n        return text.replace(old, new)\n    if count != 1:\n        raise SystemExit(f"{label}: expected 1 match, got {count}")\n    return text.replace(old, new, 1)\n'''
          old_many = '''def replace_at_least_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count < 1:\n        raise SystemExit(f"{label}: expected at least 1 match, got 0")\n    return text.replace(old, new)\n'''
          new_many = '''def replace_at_least_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count == 0:\n        if new in text:\n            return text\n        raise SystemExit(f"{label}: expected target or already-patched replacement")\n    return text.replace(old, new)\n'''
          if old_once not in s or old_many not in s:
              raise SystemExit('replacement helpers not found')
          s = s.replace(old_once, new_once, 1).replace(old_many, new_many, 1)
          p.write_text(s)
          PY
          python3 .github/scripts/add_theme_selector.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt')
          s = p.read_text()
          old = '''    private fun enterKeyLabel(english: Boolean, fallback: String? = null): String {\n        val imeOptions = (context as? android.inputmethodservice.InputMethodService)\n            ?.currentInputEditorInfo?.imeOptions\n        if (imeOptions != null) return enterKeyPresentationFor(imeOptions).label\n        return fallback ?: if (english) "Go" else context.getString(R.string.enter_confirm)\n    }\n'''
          new = '''    internal fun localizedEnterKeyLabel(imeOptions: Int): String {\n        if ((imeOptions and android.view.inputmethod.EditorInfo.IME_FLAG_NO_ENTER_ACTION) != 0) {\n            return context.getString(R.string.enter_newline)\n        }\n        return when (imeOptions and android.view.inputmethod.EditorInfo.IME_MASK_ACTION) {\n            android.view.inputmethod.EditorInfo.IME_ACTION_SEND -> context.getString(R.string.enter_send)\n            android.view.inputmethod.EditorInfo.IME_ACTION_SEARCH -> context.getString(R.string.enter_search)\n            android.view.inputmethod.EditorInfo.IME_ACTION_GO -> context.getString(R.string.enter_go)\n            android.view.inputmethod.EditorInfo.IME_ACTION_NEXT -> context.getString(R.string.enter_next)\n            android.view.inputmethod.EditorInfo.IME_ACTION_PREVIOUS -> context.getString(R.string.enter_previous)\n            android.view.inputmethod.EditorInfo.IME_ACTION_DONE -> context.getString(R.string.enter_done)\n            else -> context.getString(R.string.enter_return)\n        }\n    }\n\n    private fun enterKeyLabel(english: Boolean, fallback: String? = null): String {\n        val imeOptions = (context as? android.inputmethodservice.InputMethodService)\n            ?.currentInputEditorInfo?.imeOptions\n        if (imeOptions != null) return localizedEnterKeyLabel(imeOptions)\n        return fallback ?: if (english) context.getString(R.string.enter_go) else context.getString(R.string.enter_confirm)\n    }\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'internal fun localizedEnterKeyLabel' not in s:
              raise SystemExit('current enterKeyLabel implementation not found')
          p.write_text(s)
          PY
      - name: Structural checks
        shell: bash
        run: |
          grep -n 'spaceVoiceTriggerMs = 150L' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'settings_section_theme' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'ImeTheme.CYBERPUNK' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'localizedEnterKeyLabel' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'localizedEnterKeyLabel' app/src/main/java/llc/slacker/openime/ImeKeyboardViewV2.kt
          grep -n 'candidate_expand_more' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          grep -n 'theme selector' app/src/main/java/llc/slacker/openime/ImeDesignTokens.kt
          git diff --check
      - name: Compile Kotlin
        id: compile
        continue-on-error: true
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Record validation
        shell: bash
        run: |
          echo "compile=${{ steps.compile.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
      - name: Commit final UX followups
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt \
            app/src/main/java/llc/slacker/openime/ImeKeyboardViewV2.kt \
            app/src/main/java/llc/slacker/openime/ImeDesignTokens.kt
          git commit -m 'fix(ux): finish theme voice and i18n followups'
          git restore .github/scripts/add_theme_selector.py
          git fetch origin fix/ux-followups
          git rebase origin/fix/ux-followups
          git push origin HEAD:fix/ux-followups
