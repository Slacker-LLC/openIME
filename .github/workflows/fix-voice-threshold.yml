name: Fix voice threshold

on:
  push:
    branches:
      - fix/ux-followups
    paths:
      - .github/workflows/fix-voice-threshold.yml
      - .github/scripts/fix_voice_threshold.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-followups
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply 150 ms voice threshold
        run: python3 .github/scripts/fix_voice_threshold.py
      - name: Structural check
        shell: bash
        run: |
          grep -n 'spaceVoiceTriggerMs = 150L' app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          git diff --check
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/llc/slacker/openime/ImeKeyboardView.kt
          git commit -m 'fix(voice): restore 150ms hold threshold'
          git fetch origin fix/ux-followups
          git rebase origin/fix/ux-followups
          git push origin HEAD:fix/ux-followups
