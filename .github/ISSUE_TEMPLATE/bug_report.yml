name: Bug report
description: Report a problem that you can reproduce with a feature, a layout or stability
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Make sure that the problem occurs in the latest build.
        Do not paste passwords, clipboard content, recordings or other real typed text.
  - type: input
    id: version
    attributes:
      label: APK version or commit
      placeholder: "0.0.7-beta.1 or a commit SHA"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Xiaomi 15 / Android 16"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Input mode
      options:
        - 26-key pinyin
        - Nine-key pinyin
        - Stroke
        - English 26-key
        - Digits and symbols
        - Emoji and clipboard
        - Voice
        - Settings and floating keyboard
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use sample text that has no personal data.
      placeholder: |
        1. Open ...
        2. Switch to ...
        3. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove personal paths, typed text, tokens, passwords and recordings.
