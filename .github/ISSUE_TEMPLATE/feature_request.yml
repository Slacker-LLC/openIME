name: Feature request
description: Suggest a new input, compatibility or maintenance feature
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: Which situation is difficult today? Who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Describe the interaction, candidates, layout or setting that you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
  - type: input
    id: device
    attributes:
      label: Related device or window size
      placeholder: "For example 390 dp, tablet, foldable, landscape"
