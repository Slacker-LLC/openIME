# Rime schema
# encoding: utf-8

__include: luna_pinyin_simp.schema:/

schema:
  schema_id: luna_pinyin_simp_fuzzy
  name: 朙月拼音·简化字·模糊音
  version: "0.23"
  author:
    - openIME
  description: |
    朙月拼音简化字方案，额外启用 openIME 模糊音规则；全拼和 2-9 九键数字码共用同一词库/userdb。

speller:
  alphabet: 987654321zyxwvutsrqponmlkjihgfedcba
  initials: 987654321zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    __patch:
      - pinyin:/zh_z_bufen
      - pinyin:/n_l_bufen
      - pinyin:/en_eng_bufen
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction
      - derive/[abc]/2/
      - derive/[def]/3/
      - derive/[ghi]/4/
      - derive/[jkl]/5/
      - derive/[mno]/6/
      - derive/[pqrs]/7/
      - derive/[tuv]/8/
      - derive/[wxyz]/9/

translator:
  # Fuzzy algebra and T9 derived spellings need their own prism.
  prism: luna_pinyin_simp_fuzzy
