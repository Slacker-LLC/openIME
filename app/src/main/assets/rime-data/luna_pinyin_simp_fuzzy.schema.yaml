# Rime schema
# encoding: utf-8

__include: luna_pinyin_simp.schema:/

schema:
  schema_id: luna_pinyin_simp_fuzzy
  name: 朙月拼音·简化字·模糊音
  version: "0.24"
  author:
    - openIME
  description: |
    朙月拼音简化字方案，额外启用 openIME 模糊音规则；全拼和 2-9 九键数字码共用同一词库/userdb。

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA987654321
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA987654321
  delimiter: " '"
  algebra:
    __patch:
      - pinyin:/zh_z_bufen
      - pinyin:/n_l_bufen
      - pinyin:/en_eng_bufen
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction
      - pinyin:/t9_transliteration

translator:
  # Fuzzy algebra and the T9 transliteration use their own compiled prism.
  prism: luna_pinyin_simp_fuzzy
