# Rime schema
# encoding: utf-8

__include: luna_pinyin.schema:/

schema:
  schema_id: luna_pinyin_simp
  name: 朙月拼音·简化字
  version: "0.23"
  author:
    - 佛振 <chen.sst@gmail.com>
    - openIME
  description: |
    朙月拼音，简化字输出模式。openIME 同一方案同时接受全拼字母和中文九键 2-9 数字码。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: zh_simp
    reset: 1
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

# Keep normal full-Pinyin spellings and derive a second spelling graph for
# mobile 9-key input. Digits therefore enter librime directly instead of being
# guessed into several Pinyin strings by Kotlin first.
speller:
  alphabet: 987654321zyxwvutsrqponmlkjihgfedcba
  initials: 987654321zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    __patch:
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction
      - derive/[abc]/2/
      - derive/[def]/3/
      - derive/[ghi]/4/
      - derive/[jkl]/5/
      - derive/[mno]/6/
      - derive/[pqrs]/7/
      - derive/[tuv]/8/
      - derive/[wxyz]/9/

translator:
  prism: luna_pinyin_simp

simplifier:
  option_name: zh_simp

key_binder:
  bindings/+:
    - { when: always, accept: Control+Shift+4, toggle: zh_simp }
    - { when: always, accept: Control+Shift+dollar, toggle: zh_simp }
