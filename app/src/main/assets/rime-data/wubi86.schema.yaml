# Rime schema: wubi86 (五笔字型 86)
# encoding: utf-8
#
# openIME ships this schema for the 五笔 keyboard mode.  The dictionary it
# reads (openime_dicts/wubi86.dict.yaml) is generated locally and is not part
# of the repository; see scripts/import_doubao_data.py.

schema:
  schema_id: wubi86
  name: 五笔86
  version: "1"
  author:
    - openIME
  description: |
    五笔字型 86 版。
    按 a - y 输入字根编码，z 可作万能键使用。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  max_code_length: 4
  # 「四码唯一直接上屏」，参考键盘里默认打开：四码打完只剩一个候选时
  # 立即上屏。参考键盘的「第五码将首选词上屏」默认关闭，但 librime 的
  # speller 在 max_code_length > 0 时总会做这件事（见 DECISIONS.md）。
  auto_select: true

translator:
  dictionary: wubi86
  enable_charset_filter: true
  enable_sentence: false
  enable_encoder: false
  enable_completion: true
  max_phrase_length: 4

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
