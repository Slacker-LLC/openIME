# Rime schema
# encoding: utf-8

__include: luna_pinyin_simp.schema:/

schema:
  schema_id: luna_pinyin_simp_t9
  name: 朙月拼音·简化字·九键
  version: "0.23"
  author:
    - openIME
  description: |
    openIME 中文九键。数字 2-9 直接进入 Rime 拼写图，由 Rime 词频、组句和 userdb
    统一消歧；1 键由 Android 侧作为显式分词符处理。

speller:
  alphabet: 987654321zyxwvutsrqponmlkjihgfedcba
  initials: 987654321zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    __patch:
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction
      - derive/[abc]/2/
      - derive/[def]/3/
      - derive/[ghi]/4/
      - derive/[jkl]/5/
      - derive/[mno]/6/
      - derive/[pqrs]/7/
      - derive/[tuv]/8/
      - derive/[wxyz]/9/

translator:
  prism: luna_pinyin_simp_t9
  spelling_hints: 100
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
